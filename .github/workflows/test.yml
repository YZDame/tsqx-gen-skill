name: Verify TSQX Skill

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pipeline tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/verify_tsqx_pipeline.py
